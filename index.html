<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة مشتركين المولدة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2, h3 {
            color: #333;
            text-align: center;
        }
        .card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        input, select, button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        input {
            flex: 1;
            min-width: 140px;
        }
        button {
            cursor: pointer;
            border: none;
            color: #fff;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-primary { background-color: #007bff; }
        .btn-primary:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; }
        .btn-success:hover { background-color: #218838; }
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #c82333; }
        .btn-warning { background-color: #ffc107; color: #212529; }
        .btn-warning:hover { background-color: #e0a800; }
        .btn-secondary { background-color: #6c757d; }
        .btn-secondary:hover { background-color: #5a6268; }
        
        .tables-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .table-box {
            flex: 1;
            min-width: 340px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #eee;
            padding: 8px;
            text-align: center;
            font-size: 13px;
        }
        th { background-color: #f1f3f5; }
        
        .action-btns {
            display: flex;
            gap: 4px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .reset-box {
            text-align: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px dashed #dc3545;
        }

        /* Modal / نافذة التعديل */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ نظام إدارة مشتركين المولدة</h2>

    <!-- قسم إعدادات التليجرام -->
    <div class="card">
        <h3>🤖 إعدادات التليجرام (تحفظ دائماً)</h3>
        <div class="form-group">
            <input type="text" id="botToken" placeholder="Bot Token">
            <input type="text" id="chatId" placeholder="Chat ID">
            <button class="btn-success" onclick="saveTelegramSettings()">💾 حفظ الإعدادات دائمياً</button>
        </div>
        <small id="settingsStatus" style="color: green; display: block; font-weight: bold;"></small>
    </div>

    <!-- قسم إضافة مشترك -->
    <div class="card">
        <h3>➕ إضافة مشترك جديد</h3>
        <div class="form-group">
            <input type="text" id="custName" placeholder="اسم المشترك">
            <input type="text" id="custPhone" placeholder="رقم الهاتف">
            <input type="text" id="custBoard" placeholder="رقم البورد">
            <input type="text" id="custBreaker" placeholder="رقم الجوزة">
            <input type="number" id="custAmperes" placeholder="عدد الأمبيرات">
            <input type="number" id="custAmount" placeholder="المبلغ المطلوب">
            <button class="btn-primary" onclick="addCustomer()">إضافة</button>
        </div>
    </div>

    <!-- جداول المشتركين -->
    <div class="tables-container">
        <!-- غير المسددين -->
        <div class="table-box">
            <h3 style="color: #dc3545;">❌ قائمة غير المسددين</h3>
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>الأمبيرات</th>
                        <th>المبلغ</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="unpaidTable"></tbody>
            </table>
        </div>

        <!-- المسددين -->
        <div class="table-box">
            <h3 style="color: #28a745;">✅ قائمة المسددين</h3>
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>الأمبيرات</th>
                        <th>المبلغ</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="paidTable"></tbody>
            </table>

            <!-- زر تصفير جميع المسددين -->
            <div class="reset-box">
                <button class="btn-danger" style="padding: 10px 20px; font-size: 15px;" onclick="resetAllPaid()">
                    🔄 تصفير الشهر (إعادة جميع المسددين إلى غير مسددين)
                </button>
            </div>
        </div>
    </div>
</div>

<!-- نافذة التعديل (Modal) -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h3>✏️️ تعديل بيانات المشترك</h3>
        <input type="hidden" id="editCustId">
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <label>اسم المشترك: <input type="text" id="editName"></label>
            <label>رقم الهاتف: <input type="text" id="editPhone"></label>
            <label>رقم البورد: <input type="text" id="editBoard"></label>
            <label>رقم الجوزة: <input type="text" id="editBreaker"></label>
            <label>عدد الأمبيرات: <input type="number" id="editAmperes"></label>
            <label>المبلغ المطلوب: <input type="number" id="editAmount"></label>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn-success" style="flex: 1;" onclick="saveCustomerEdit()">حفظ التعديلات 💾</button>
                <button class="btn-secondary" style="flex: 1;" onclick="closeEditModal()">إلغاء ❌</button>
            </div>
        </div>
    </div>
</div>

<script>
    let customers = JSON.parse(localStorage.getItem('generator_customers')) || [];

    // عند تحميل الصفحة تلقائياً
    window.onload = function() {
        loadTelegramSettings();
        renderTables();
    };

    // حفظ إعدادات التليجرام في localStorage دائمياً
    function saveTelegramSettings() {
        const token = document.getElementById('botToken').value.trim();
        const chatId = document.getElementById('chatId').value.trim();

        if(!token || !chatId) {
            alert('يرجى ملء الخانتين أولاً!');
            return;
        }

        localStorage.setItem('tg_bot_token', token);
        localStorage.setItem('tg_chat_id', chatId);

        const status = document.getElementById('settingsStatus');
        status.innerText = "✅ تم حفظ التوكن والـ ID بنجاح! ولن ينمحوا عند إغلاق أو إعادة فتح البرنامج.";
        setTimeout(() => status.innerText = "", 4000);
    }

    // استرجاع الإعدادات عند فتح البرنامج
    function loadTelegramSettings() {
        const savedToken = localStorage.getItem('tg_bot_token');
        const savedChatId = localStorage.getItem('tg_chat_id');

        if(savedToken) document.getElementById('botToken').value = savedToken;
        if(savedChatId) document.getElementById('chatId').value = savedChatId;
    }

    // إضافة مشترك جديد
    function addCustomer() {
        const name = document.getElementById('custName').value.trim();
        const phone = document.getElementById('custPhone').value.trim();
        const board = document.getElementById('custBoard').value.trim();
        const breaker = document.getElementById('custBreaker').value.trim();
        const amperes = document.getElementById('custAmperes').value.trim();
        const amount = document.getElementById('custAmount').value.trim();

        if(!name || !amount) {
            alert('يرجى كتابة اسم المشترك والمبلغ على الأقل');
            return;
        }

        const newCust = {
            id: Date.now(),
            name, phone, board, breaker, amperes, amount,
            paid: false
        };

        customers.push(newCust);
        saveCustomers();
        renderTables();

        // مسح الخانات
        document.getElementById('custName').value = '';
        document.getElementById('custPhone').value = '';
        document.getElementById('custBoard').value = '';
        document.getElementById('custBreaker').value = '';
        document.getElementById('custAmperes').value = '';
        document.getElementById('custAmount').value = '';
    }

    // حفظ قائمة المشتركين
    function saveCustomers() {
        localStorage.setItem('generator_customers', JSON.stringify(customers));
    }

    // عرض القوائم
    function renderTables() {
        const unpaidTable = document.getElementById('unpaidTable');
        const paidTable = document.getElementById('paidTable');

        unpaidTable.innerHTML = '';
        paidTable.innerHTML = '';

        customers.forEach(c => {
            if(!c.paid) {
                unpaidTable.innerHTML += `
                    <tr>
                        <td>${c.name}</td>
                        <td>${c.amperes || '-'}</td>
                        <td>${c.amount}</td>
                        <td class="action-btns">
                            <button class="btn-success" onclick="markAsPaid(${c.id})">تسديد 💳</button>
                            <button class="btn-warning" onclick="openEditModal(${c.id})">تعديل ✏️</button>
                            <button class="btn-danger" onclick="deleteCustomer(${c.id})">🗑️</button>
                        </td>
                    </tr>
                `;
            } else {
                paidTable.innerHTML += `
                    <tr>
                        <td>${c.name}</td>
                        <td>${c.amperes || '-'}</td>
                        <td>${c.amount}</td>
                        <td class="action-btns">
                            <button class="btn-secondary" onclick="markAsUnpaid(${c.id})">إلغاء التسديد ↩️</button>
                            <button class="btn-warning" onclick="openEditModal(${c.id})">تعديل ✏️</button>
                            <button class="btn-danger" onclick="deleteCustomer(${c.id})">🗑️</button>
                        </td>
                    </tr>
                `;
            }
        });
    }

    // التحويل إلى مسدد وإرسال إشعار بالتليجرام
    function markAsPaid(id) {
        const cust = customers.find(c => c.id === id);
        if(cust) {
            cust.paid = true;
            saveCustomers();
            renderTables();
            sendTelegramNotification(cust);
        }
    }

    // إلغاء التسديد لمشترك واحد (إعادته إلى قائمة غير المسددين)
    function markAsUnpaid(id) {
        const cust = customers.find(c => c.id === id);
        if(cust) {
            cust.paid = false;
            saveCustomers();
            renderTables();
        }
    }

    // تصفير الشهر بالكامل (إعادة جميع المسددين إلى غير مسددين)
    function resetAllPaid() {
        const paidCount = customers.filter(c => c.paid).length;
        if(paidCount === 0) {
            alert('لا يوجد مشتركين في قائمة المسددين لتصفيرهم!');
            return;
        }

        if(confirm(`هل أنت تأكد من تصفير الشهر؟ سيتم تحويل ${paidCount} مشتركين من قائمة المسددين إلى قائمة غير المسددين لتبدأ شهراً جديداً.`)) {
            customers.forEach(c => c.paid = false);
            saveCustomers();
            renderTables();
            alert('تم تصفير القائمة بنجاح وإعادة جميع المشتركين إلى قائمة غير المسددين!');
        }
    }

    // فتح نافذة التعديل وتعبئة البيانات
    function openEditModal(id) {
        const cust = customers.find(c => c.id === id);
        if(cust) {
            document.getElementById('editCustId').value = cust.id;
            document.getElementById('editName').value = cust.name || '';
            document.getElementById('editPhone').value = cust.phone || '';
            document.getElementById('editBoard').value = cust.board || '';
            document.getElementById('editBreaker').value = cust.breaker || '';
            document.getElementById('editAmperes').value = cust.amperes || '';
            document.getElementById('editAmount').value = cust.amount || '';
            document.getElementById('editModal').style.display = 'flex';
        }
    }

    // إغلاق نافذة التعديل
    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    // حفظ التعديلات على المشترك
    function saveCustomerEdit() {
        const id = parseInt(document.getElementById('editCustId').value);
        const cust = customers.find(c => c.id === id);

        if(cust) {
            cust.name = document.getElementById('editName').value.trim();
            cust.phone = document.getElementById('editPhone').value.trim();
            cust.board = document.getElementById('editBoard').value.trim();
            cust.breaker = document.getElementById('editBreaker').value.trim();
            cust.amperes = document.getElementById('editAmperes').value.trim();
            cust.amount = document.getElementById('editAmount').value.trim();

            if(!cust.name || !cust.amount) {
                alert('الاسم والمبلغ مطلوبان!');
                return;
            }

            saveCustomers();
            renderTables();
            closeEditModal();
        }
    }

    // حذف مشترك
    function deleteCustomer(id) {
        if(confirm('هل أنت تأكد من حذف هذا المشترك؟')) {
            customers = customers.filter(c => c.id !== id);
            saveCustomers();
            renderTables();
        }
    }

    // دالة إرسال الإشعار إلى التليجرام
    function sendTelegramNotification(cust) {
        const token = localStorage.getItem('tg_bot_token');
        const chatId = localStorage.getItem('tg_chat_id');

        if(!token || !chatId) {
            alert('تحذير: لم يتم حفظ إعدادات التليجرام، لن يصلك إشعار!');
            return;
        }

        const message = `
✅ *تم تسديد اشتراك جديد*

👤 *الاسم:* ${cust.name}
📞 *الهاتف:* ${cust.phone || 'غير محدد'}
🔢 *رقم البورد:* ${cust.board || '-'}
🔌 *رقم الجوزة:* ${cust.breaker || '-'}
⚡ *عدد الأمبيرات:* ${cust.amperes || '-'}
💰 *المبلغ المسدد:* ${cust.amount} دينار
        `;

        const url = `https://api.telegram.org/bot${token}/sendMessage`;

        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: chatId,
                text: message,
                parse_mode: 'Markdown'
            })
        })
        .then(res => res.json())
        .then(data => {
            if(!data.ok) console.error("Telegram Error:", data);
        })
        .catch(err => console.error("Error:", err));
    }
</script>

</body>
</html>
